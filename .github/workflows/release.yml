name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Extract changelog for this version
          VERSION=${{ steps.version.outputs.VERSION }}
          python3 << 'EOF'
          import re

          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          # Extract section for this version
          pattern = rf'## \[{re.escape("$VERSION".replace("$", ""))}.*?\n(.*?)(?=\n## |\Z)'
          match = re.search(pattern, content, re.DOTALL)

          if match:
              changelog = match.group(1).strip()
          else:
              changelog = "See CHANGELOG.md for details"

          print(changelog)
          EOF
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            README.md
            CHANGELOG.md
            LICENSE
          draft: false
          prerelease: false
          body: |
            # Release v${{ steps.version.outputs.VERSION }}

            ## Changes

            See [CHANGELOG.md](https://github.com/CodesbyFebin/Android-Flashing-Tool/blob/main/CHANGELOG.md) for full details.

            ## Installation

            ```bash
            git clone https://github.com/CodesbyFebin/Android-Flashing-Tool.git
            cd Android-Flashing-Tool
            git checkout v${{ steps.version.outputs.VERSION }}
            python3 -m venv .venv
            source .venv/bin/activate
            pip install -r requirements.txt
            python3 runtime.py
            ```

            ## Verification

            All releases are tagged with git tags and include checksums for verification.

            ```bash
            # Verify your download
            sha256sum android-flashing-tool-v${{ steps.version.outputs.VERSION }}.tar.gz
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send release notification
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "✅ Release v$VERSION published!"
          echo "📖 Docs: https://github.com/CodesbyFebin/Android-Flashing-Tool"
          echo "📥 Download: https://github.com/CodesbyFebin/Android-Flashing-Tool/releases/tag/v$VERSION"
